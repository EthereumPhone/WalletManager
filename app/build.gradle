plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.baselineprofile)
}

android {
    namespace 'org.ethereumphone.walletmanager'
    compileSdk 34

    buildFeatures {
        compose = true
    }

    defaultConfig {
        applicationId "org.ethereumphone.walletmanager"
        minSdk 34
        targetSdk 34
        versionCode 13
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.3"
    }
}

dependencies {


    implementation project(path: ':core:model')
    implementation project(path: ':core:domain')
    implementation project(path: ':core:data')
    implementation project(path: ':core:ui')

    implementation project(path: ':core:designsystem')
    implementation project(path: ':workers:work')
    implementation project(path: ':feature:home')
    implementation project(path: ':feature:swap')
    implementation project(path: ':feature:send')
    implementation project(path: ':feature:receive')
    implementation project(path: ':feature:paymaster')

    implementation project(path: ':feature:assets')
    implementation project(path: ':feature:transactions')

    implementation 'androidx.tracing:tracing:1.3.0-alpha02'


    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.material3


    implementation libs.androidx.navigation.compose
    implementation libs.androidx.profileinstaller

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation "com.google.accompanist:accompanist-systemuicontroller:0.28.0"




    // Web3j
    implementation 'org.web3j:core:4.9.4'

    // Gson
    implementation 'com.google.code.gson:gson:2.10'

    // ENS resolving
    implementation 'com.github.komputing.kethereum:ens:0.85.7'
    implementation 'com.github.komputing.kethereum:rpc:0.85.7'
    implementation 'com.github.komputing.kethereum:model:0.85.7'



    // Compose
    implementation 'androidx.activity:activity-compose:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation libs.androidx.lifecycle.compose

    implementation 'androidx.compose.material:material:1.2.1'
    implementation "androidx.compose.material:material-icons-extended:1.2.1"
    implementation "androidx.compose.runtime:runtime-livedata:1.2.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.2.1"
    baselineProfile project(':baselineprofile')


    debugImplementation("androidx.compose.ui:ui-tooling:1.2.1")
    implementation "androidx.compose.ui:ui:1.2.1"
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.2.1")

    //Moshi
    implementation 'com.squareup.moshi:moshi-kotlin:1.13.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'

    // QR Generation
    implementation 'com.github.kenglxn.QRGen:android:3.0.1'

    // camera x
    implementation "androidx.camera:camera-camera2:1.1.0-beta02"
    implementation "androidx.camera:camera-lifecycle:1.1.0-beta02"
    implementation "androidx.camera:camera-view:1.1.0-beta02"

    // zxing
    implementation('com.journeyapps:zxing-android-embedded:4.3.0')
    implementation("com.google.zxing:core:3.4.1")

    // Barcode Scanning

    implementation libs.hilt.android
    ksp (libs.hilt.compiler)

    ksp( libs.androidx.hilt.compiler )

    implementation libs.androidx.hilt.work
    implementation libs.androidx.work.runtime.ktx



    implementation libs.ethos.wallet

    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation 'com.github.EthereumPhone:ethOS-Component-Library:36e645b378'

    //implementation libs.core.splashscreen

    implementation project(path: ':core:terminalsdk')


}