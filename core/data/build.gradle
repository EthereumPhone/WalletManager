plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.ksp
    alias libs.plugins.hilt.android
    id("kotlinx-serialization")
}


android {
    namespace 'com.core.data'
    compileSdk 34

    defaultConfig {
        minSdk 34
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        Properties properties = new Properties()
        properties.load(project.rootProject.file("local.properties").newDataInputStream())

        // Fail the build early if any required API key is missing or blank
        ["BUNDLER_API", "ALCHEMY_API", "TOKEN_PRICE_API"].each { key ->
            def value = properties.getProperty(key)
            if (value == null || value.trim().isEmpty()) {
                throw new GradleException("$key is not defined in local.properties – please add it before building.")
            }
        }

        def alchemyApi = properties.getProperty("ALCHEMY_API")
        def tokenPriceApi = properties.getProperty("TOKEN_PRICE_API")
        def bundlerApi = properties.getProperty("BUNDLER_API")
        def zeroXApi = properties.getProperty("ZEROX_API_KEY", "")
        
        // WalletConnect Project ID (optional, won't fail build if missing)
        def walletConnectProjectId = properties.getProperty("walletconnect.projectId", "")

        buildConfigField "String", "ALCHEMY_API", "\"${alchemyApi}\""
        buildConfigField "String", "TOKEN_PRICE_API", "\"${tokenPriceApi}\""
        buildConfigField "String", "BUNDLER_API", "\"${bundlerApi}\""
        buildConfigField "String", "ZEROX_API_KEY", "\"${zeroXApi}\""
        buildConfigField "String", "WALLETCONNECT_PROJECT_ID", "\"${walletConnectProjectId}\""








    }

    buildFeatures {
        buildConfig = true // <--- Enable BuildConfig generation in a library module
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation project(path: ':core:database')
    implementation project(path: ':core:model')
    implementation project(path: ':core:common')
    implementation project(path: ':core:datastore')
    implementation project(path: ':core:terminalsdk')
    implementation project(path: ':uniswap-routing-sdk')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.squareup.moshi:moshi-kotlin:1.13.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'

    // Room dependencies for BroadcastReceiver
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx

    implementation libs.ethos.wallet
    implementation libs.web3j.android
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.gson
    implementation libs.okhttp

    implementation libs.moshi
    implementation libs.kotlinx.datetime

    implementation libs.fasterxml
    implementation libs.headlong

    // ENS resolving
    implementation 'com.github.komputing.kethereum:ens:0.85.7'
    implementation 'com.github.komputing.kethereum:rpc:0.85.7'
    implementation 'com.github.komputing.kethereum:model:0.85.7'

    implementation(libs.androidx.tracing.ktx)
    implementation(libs.retrofit.kotlin.serialization)
    implementation(libs.kotlinx.serialization.json)

    // WalletConnect (Reown SDK)
    implementation("com.reown:android-core:1.4.11")
    implementation("com.reown:walletkit:1.4.11")


}