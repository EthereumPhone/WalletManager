# libs
ktx = "1.9.0"
appcompat = "1.6.1"
androidx-junit = "1.1.5"
junit-version = "4.13.2"
androidxTracing = "1.3.0-alpha02"

espresso = "3.5.1"
compose = "1.4.3"

roomdb = "2.6.1"
work = "2.8.1"
hilt-jetpack = "1.2.0"
datastore = "1.1.3"
