plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.hilt.android
    alias libs.plugins.ksp
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.feature.swap'
    compileSdk 35

    defaultConfig {
        minSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.6"
    }
}

dependencies {
    implementation project(path: ':core:data')
    implementation project(path: ':core:domain')
    implementation project(path: ':core:database')
    implementation project(path: ':core:model')
    implementation project(path: ':core:common')
    implementation project(path: ':core:ui')
    implementation project(path: ':core:designsystem')
    implementation project(path: ':feature:home')
    implementation project(path: ':core:terminalsdk')


    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.material3
    implementation libs.ethos.wallet

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.espresso.core
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"

    implementation libs.androidx.navigation.compose

    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    implementation libs.androidx.compose.icons
    implementation libs.androidx.compose.ui

    implementation "androidx.compose.animation:animation:1.4.3"
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"
    debugImplementation("androidx.compose.ui:ui-tooling:1.4.3")

    implementation libs.androidx.lifecycle.compose

    implementation 'com.github.EthereumPhone:ethOS-Component-Library:9c7ef3ee91'

    // Coil for image loading
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp
    implementation "io.coil-kt:coil-compose:2.6.0"   // Compose image loading
    implementation "io.coil-kt:coil-gif:2.6.0"       // GIF decoding


    implementation project(':feature:home')
    implementation project(':feature:assets')

    // Roborazzi for screenshot tests (instrumented and Robolectric)
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi:1.51.0"
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.51.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.51.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.51.0"
    testImplementation("org.robolectric:robolectric:4.16")



}