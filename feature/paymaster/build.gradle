plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.feature.paymaster'
    compileSdk 35

    defaultConfig {
        minSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.material3
    implementation project(path: ':core:data')
    implementation project(path: ':core:domain')
    implementation project(path: ':core:model')
    implementation project(path: ':core:common')
    implementation project(path: ':core:ui')
    implementation project(path: ':core:designsystem')
    implementation project(path: ':core:terminalsdk')
    testImplementation libs.junit
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.espresso

    implementation libs.androidx.navigation.compose

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.compose.material:material:1.4.3'
    implementation "androidx.compose.material:material-icons-extended:1.4.3"
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"
    implementation 'androidx.compose.foundation:foundation:1.4.3'

    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    implementation libs.androidx.lifecycle.compose
    implementation libs.kotlinx.datetime

    debugImplementation("androidx.compose.ui:ui-tooling:1.2.1")
    debugImplementation("androidx.compose.ui:ui-test-manifest:1.4.3")
    implementation "androidx.compose.ui:ui:1.2.1"
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.4.3")

    implementation project(path: ':core:ui')

    implementation libs.okhttp
    implementation libs.ethos.wallet
    implementation libs.web3j.android
    implementation libs.moshi

    // Roborazzi for screenshot tests (instrumented and Robolectric)
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi:1.51.0"
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.51.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.51.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.51.0"
    testImplementation("org.robolectric:robolectric:4.16")
}