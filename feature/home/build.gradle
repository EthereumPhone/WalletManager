plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.hilt.android
    alias libs.plugins.ksp
    alias(libs.plugins.kotlin.compose)
    id 'io.github.takahirom.roborazzi'

}


android {
    namespace 'com.feature.home'
    compileSdk 35

    defaultConfig {
        minSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.6"
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

dependencies {
    implementation project(path: ':core:data')
    implementation project(path: ':core:domain')
    implementation project(path: ':core:model')
    implementation project(path: ':core:common')
    implementation project(path: ':core:ui')
    implementation project(path: ':core:designsystem')
    implementation project(path: ':core:database')
    implementation project(path: ':core:terminalsdk')


    implementation libs.androidx.core
    implementation libs.androidx.appcompat

    implementation "androidx.compose.material3:material3:1.1.1"
    implementation project(':feature:transactions')
    implementation project(':feature:send')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.1'
    implementation 'androidx.compose.material:material:1.4.3'
    implementation "androidx.compose.material:material-icons-extended:1.4.3"
    implementation libs.androidx.navigation.compose
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'androidx.compose.foundation:foundation:1.4.3'


    implementation "androidx.compose.ui:ui:1.4.3"
    debugImplementation("androidx.compose.ui:ui-tooling:1.4.3")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.4.3")
    testImplementation("androidx.compose.ui:ui-test-junit4:1.4.3")
    debugImplementation("androidx.compose.ui:ui-test-manifest:1.4.3")

    // Hilt testing
    androidTestImplementation("com.google.dagger:hilt-android-testing:2.55")
    kspAndroidTest libs.hilt.compiler
    
    // Roborazzi for screenshot tests (instrumented and Robolectric)
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi:1.51.0"
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.51.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.51.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.51.0"
    testImplementation("org.robolectric:robolectric:4.16")


    // Web3j needed for the WalletSDK
    implementation libs.web3j.android
    implementation libs.ethos.wallet




    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    implementation libs.androidx.lifecycle.compose
    implementation libs.kotlinx.datetime

    implementation 'com.github.EthereumPhone:ethOS-Component-Library:9c7ef3ee91'

    implementation libs.squareup.moshi
    implementation libs.moshi
    implementation libs.okhttp

    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    implementation libs.kotlinx.serialization.json

    
    implementation "io.coil-kt:coil-compose:2.6.0"   // Compose image loading
    implementation "io.coil-kt:coil-gif:2.6.0"       // GIF decoding

    implementation "dev.chrisbanes.snapper:snapper:0.3.0"
}

roborazzi {
    outputDir = file("$rootDir/screenshots")
}