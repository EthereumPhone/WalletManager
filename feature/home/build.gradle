android {
    namespace 'com.feature.home'
    compileSdk 34

    defaultConfig {
        minSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.6"
    }
}

dependencies {
    implementation project(path: ':core:data')
    implementation project(path: ':core:domain')
    implementation project(path: ':core:model')
    implementation project(path: ':core:common')
    implementation project(path: ':core:ui')
    implementation project(path: ':core:designsystem')
    implementation project(path: ':core:database')


    implementation libs.androidx.core
    implementation libs.androidx.appcompat

    implementation "androidx.compose.material3:material3:1.1.1"
    implementation project(':feature:transactions')
    implementation project(':feature:send')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.compose.material:material:1.4.3'
    implementation "androidx.compose.material:material-icons-extended:1.4.3"
    implementation libs.androidx.navigation.compose
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'androidx.compose.foundation:foundation:1.6.0-alpha02'


    debugImplementation("androidx.compose.ui:ui-tooling:1.2.1")
    implementation "androidx.compose.ui:ui:1.2.1"
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.2.1")

    // Web3j needed for the WalletSDK
    implementation libs.web3j.android
    implementation libs.ethos.wallet




    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    implementation libs.androidx.lifecycle.compose
    implementation libs.kotlinx.datetime

    implementation 'com.github.EthereumPhone:ethOS-Component-Library:9c7ef3ee91'

    implementation libs.squareup.moshi
    implementation libs.moshi
    implementation libs.okhttp

    implementation libs.coil.compose
